version: '3.8'

services:
  fastapi_app:
    build: .
    container_name: luxestay_fastapi
    env_file:
      - .env
    expose:
      - "8000"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: luxestay_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fastapi_app
    restart: always